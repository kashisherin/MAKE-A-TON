components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        user_email:
          type: string
          format: email
          readOnly: true
        user_role:
          type: string
          maxLength: 20
        action:
          type: string
          maxLength: 80
        entity_type:
          type: string
          maxLength: 80
        entity_id:
          type: string
          maxLength: 80
        timestamp:
          type: string
          format: date-time
          readOnly: true
        before_values: {}
        after_values: {}
        metadata: {}
      required:
      - action
      - entity_id
      - entity_type
      - id
      - timestamp
      - user_email
    BillingFrequencyEnum:
      enum:
      - DAILY
      - WEEKLY
      - MONTHLY
      - YEARLY
      type: string
      description: |-
        * `DAILY` - Daily
        * `WEEKLY` - Weekly
        * `MONTHLY` - Monthly
        * `YEARLY` - Yearly
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        assigned_staff:
          type: integer
          nullable: true
        company_name:
          type: string
          maxLength: 200
        contact_person:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone_number:
          type: string
          maxLength: 30
        address:
          type: string
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contact_person
      - created_at
      - email
      - id
      - updated_at
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    PaginatedAuditLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
